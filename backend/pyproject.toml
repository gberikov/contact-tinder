[project]
name = "contact-tinder-backend"
version = "0.1.0"
description = "Contact Tinder backend — Google People API snapshots & working copies"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "respx>=0.21",
]
# Spark/Zingg dedup engine. In the `dedup` container these come from the official zingg/zingg
# image (NOT pip); this group is only for running the engine locally outside that image. Never CI.
dedup = [
    "pyspark>=3.5,<3.6",
    "zingg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# `slow` = real Zingg/Spark + perf tests; excluded from the default lane (no Spark/JVM in CI).
markers = [
    "slow: requires Spark/JVM/Zingg or is a performance test (run with -m slow)",
]
addopts = "-m 'not slow'"
