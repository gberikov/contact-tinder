services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: contacttinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d contacttinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/contacttinder
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: python -m src.workers.import_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/contacttinder
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev -- --host
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Deduplication engine (feature 002): built FROM the official zingg/zingg image (Spark + JVM +
  # Zingg + python `zingg`), with our worker layered on. Consumes DedupRun jobs from Postgres
  # (FOR UPDATE SKIP LOCKED). Contact data stays on the internal network (Principle I).
  dedup:
    build:
      context: ./backend
      dockerfile: Dockerfile.dedup
    command: python -m src.workers.dedup_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/contacttinder
      DEDUP_ENGINE: zingg
      DEDUP_JDBC_URL: jdbc:postgresql://db:5432/contacttinder
      DEDUP_JDBC_USER: app
      DEDUP_JDBC_PASSWORD: app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
